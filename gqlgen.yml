schema:
  - graph/schema/*.graphqls

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

autobind:
  - backend-productos/internal/domain/model

models:
  Producto:
    fields:
      categoria:
        resolver: true
      inventario:
        resolver: true
  Categoria:
    fields:
      productos:
        resolver: true
