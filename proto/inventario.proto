syntax = "proto3";

package productos;

option go_package = "backend-productos/proto;proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message Inventario {
  string id = 1;
  string producto_id = 2;
  int32 cantidad = 3;
  string almacen = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CreateInventarioRequest {
  string producto_id = 1;
  int32 cantidad = 2;
  string almacen = 3;
}

message CreateInventarioResponse {
  Inventario inventario = 1;
}

message GetInventarioRequest {
  string id = 1;
}

message GetInventarioResponse {
  Inventario inventario = 1;
}

message GetInventarioByProductoIdRequest {
  string producto_id = 1;
}

message GetInventarioByProductoIdResponse {
  Inventario inventario = 1;
}

message UpdateInventarioRequest {
  string id = 1;
  string producto_id = 2;
  int32 cantidad = 3;
  string almacen = 4;
}

message UpdateInventarioResponse {
  Inventario inventario = 1;
}

message DeleteInventarioRequest {
  string id = 1;
}

message ListInventariosRequest {
}

message ListInventariosResponse {
  repeated Inventario inventarios = 1;
}

service InventarioService {
  rpc CreateInventario(CreateInventarioRequest) returns (CreateInventarioResponse);
  rpc GetInventario(GetInventarioRequest) returns (GetInventarioResponse);
  rpc GetInventarioByProductoId(GetInventarioByProductoIdRequest) returns (GetInventarioByProductoIdResponse);
  rpc UpdateInventario(UpdateInventarioRequest) returns (UpdateInventarioResponse);
  rpc DeleteInventario(DeleteInventarioRequest) returns (google.protobuf.Empty);
  rpc ListInventarios(ListInventariosRequest) returns (ListInventariosResponse);
}
