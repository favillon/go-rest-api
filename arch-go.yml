version: 1
threshold:
    compliance: 100
    coverage: 100
dependenciesRules:
    - package: 'backend-productos'
      shouldOnlyDependsOn:
        internal:
            - '**.internal.**'
            - '**.config.**'
            - '**.proto.**'
            - github.com/joho/godotenv
            - google.golang.org/grpc
    - package: '**.internal.domain.**'
      shouldOnlyDependsOn:
        internal:
            - '**.internal.domain.**'
            - github.com/google/uuid
    - package: '**.internal.application.**'
      shouldOnlyDependsOn:
        internal:
            - '**.internal.domain.**'
            - '**.internal.application.**'
            - github.com/google/uuid
    - package: '**.internal.infrastructure.**'
      shouldOnlyDependsOn:
        internal:
            - '**.internal.domain.**'
            - '**.internal.application.**'
            - '**.internal.infrastructure.**'
            - '**.proto.**'
            - github.com/google/uuid
            - go.mongodb.org/mongo-driver
            - google.golang.org/grpc
            - github.com/stretchr/testify
    - package: '**.config.**'
      shouldOnlyDependsOn:
        internal:
            - '**.config.**'
            - go.mongodb.org/mongo-driver
    - package: '**.proto.**'
      shouldOnlyDependsOn:
        internal:
            - '**.proto.**'
            - google.golang.org/protobuf
