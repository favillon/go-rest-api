version: 1
threshold:
    compliance: 100
    coverage: 100
dependenciesRules:
    - package: 'backend-productos'
      shouldOnlyDependsOn:
        internal:
            - '**.internal.**'
            - '**.config.**'
            - '**.graph.**'
            - github.com/gin-gonic/gin
            - github.com/joho/godotenv
            - github.com/99designs/gqlgen
    - package: '**.internal.domain.**'
      shouldOnlyDependsOn:
        internal:
            - '**.internal.domain.**'
            - github.com/google/uuid
    - package: '**.internal.application.**'
      shouldOnlyDependsOn:
        internal:
            - '**.internal.domain.**'
            - '**.internal.application.**'
            - github.com/google/uuid
    - package: '**.internal.infrastructure.**'
      shouldOnlyDependsOn:
        internal:
            - '**.internal.domain.**'
            - '**.internal.application.**'
            - '**.internal.infrastructure.**'
            - github.com/google/uuid
            - go.mongodb.org/mongo-driver
            - github.com/gin-gonic/gin
            - github.com/stretchr/testify
    - package: '**.config.**'
      shouldOnlyDependsOn:
        internal:
            - '**.config.**'
            - go.mongodb.org/mongo-driver
    - package: '**.graph.**'
      shouldOnlyDependsOn:
        internal:
            - '**.internal.domain.**'
            - '**.internal.application.**'
            - '**.graph.**'
            - github.com/google/uuid
            - github.com/99designs/gqlgen
