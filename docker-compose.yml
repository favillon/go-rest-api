services:
  postgres:
    image: postgres:18
    container_name: backend-productos-postgres
    restart: unless-stopped
    ports:
      - "5432:${POSTGRES_PORT}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_go:/var/lib/postgresql

volumes:
  postgres_data_go:
