services:
  mongodb:
    image: mongo:7
    container_name: backend-productos-grpc-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet -u ${MONGO_USER} -p ${MONGO_PASSWORD} --authenticationDatabase admin
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: backend-productos-grpc-app
    restart: unless-stopped
    ports:
      - "${PORT_GRPC:-50051}:50051"
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB}
      PORT_GRPC: 50051
    env_file:
      - .env.docker
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${PORT_GRPC:-50051} >/dev/null || exit 1"]
      interval: 1m
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - .:/app
    stdin_open: true
    tty: true

volumes:
  mongo_data:
