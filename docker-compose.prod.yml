services:
  mongodb:
    image: mongo:7
    container_name: backend-productos-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet -u ${MONGO_USER} -p ${MONGO_PASSWORD} --authenticationDatabase admin
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT_APP: ${PORT_APP:-8082}
    container_name: backend-productos-app
    restart: unless-stopped
    ports:
      - "${PORT_APP:-8082}:${PORT_APP:-8082}"
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB}
      PORT_APP: ${PORT_APP:-8082}
      RATE_LIMIT_READ_PER_MINUTE: ${RATE_LIMIT_READ_PER_MINUTE:-30}
      RATE_LIMIT_WRITE_PER_MINUTE: ${RATE_LIMIT_WRITE_PER_MINUTE:-10}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:${PORT_APP:-8082}/api/v1/graphql >/dev/null || exit 1"]
      interval: 1m
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
